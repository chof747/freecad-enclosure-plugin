[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-enclosure-plugin"
version = "0.1.0"
description = "FreeCAD enclosure workbench scaffold"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "debugpy>=1.8.0",
  "flake8>=7.0.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203"]
